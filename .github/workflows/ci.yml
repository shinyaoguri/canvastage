name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# PR は連続 push で古い実行をキャンセルして無駄を省く。main(本番デプロイ) は
# 途中キャンセルしない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 既定トークンは読み取りのみ（deploy ジョブのみ追加権限を明示）。
permissions:
  contents: read

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck Pages Functions
        run: npm run typecheck:functions

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (typecheck + bundle)
        run: npm run build

      # deploy ジョブが再利用するビルド成果物（dist/_headers 等を含む）。
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: e2e (settings regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # webServer が build → preview を行うため、ここでの明示ビルドは不要。
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy (cloudflare pages)
    runs-on: ubuntu-latest
    # build の成果物を再利用する（重複ビルドを避ける）。
    needs: build
    # Dependabot の PR はセキュリティ上シークレットを受け取れず、デプロイが必ず
    # 失敗する。ビルド検証は build / e2e ジョブが担うので、このジョブはスキップする。
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      # wrangler pages deploy には functions ディレクトリを指定するフラグが無く、
      # cwd 直下の functions/ を暗黙に拾う。checkout を省くと Pages Functions
      # (OAuth コールバック) が無言でデプロイされず、GitHub サインインが壊れる。
      # 順序が重要: checkout の既定 clean: true は git clean -ffdx を走らせるため、
      # dist/ を落とした後に置くと gitignore 済みの dist/ ごと消える。
      - name: Checkout Pages Functions
        uses: actions/checkout@v7
        with:
          sparse-checkout: functions

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Deploy to Cloudflare Pages (Preview)
        if: github.event_name == 'pull_request'
        id: preview-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref }}

      # Pages Functions が実際に配信されているかをデプロイ後に確かめる。
      # functions/ が cwd に無いまま deploy しても wrangler は成功するため、
      # OAuth コールバックが静かに消えても CI は緑のままだった（#83）。
      # /api/auth/callback は code パラメータ無しなら 400 を返す
      # （functions/api/auth/callback.ts）。エディタの HTML が返る = Function 不在。
      - name: Verify Pages Functions are live
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PREVIEW_URL: ${{ steps.preview-deploy.outputs.deployment-url }}
        run: |
          # 三項演算子の慣用句（A && B || C）は使わない。PREVIEW_URL が空文字だと
          # falsy 扱いで本番 URL に落ち、PR なのに本番を検査して緑になる。
          if [ "$IS_PR" = "true" ]; then
            BASE_URL="$PREVIEW_URL"
          else
            BASE_URL="https://canvastage.soui.dev"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::デプロイ先 URL を取得できなかった。"
            exit 1
          fi
          for _ in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/callback" || echo 000)
            if [ "$code" = "400" ]; then
              echo "OK: $BASE_URL/api/auth/callback -> 400"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$BASE_URL/api/auth/callback が $code を返した（期待値 400）。Pages Functions が配信されていない。"
          exit 1

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `${{ steps.preview-deploy.outputs.command-output }}`;
            const urlMatch = output.match(/https:\/\/[^\s]+\.pages\.dev/);
            const previewUrl = urlMatch ? urlMatch[0] : null;

            if (!previewUrl) {
              console.log('Could not extract preview URL from output:', output);
              return;
            }

            const body = `## 🚀 Preview Deployment

            | Name | URL |
            |------|-----|
            | Preview | ${previewUrl} |

            *Deployed from commit ${context.sha.substring(0, 7)}*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 🚀 Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
